<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Playground Entrance</title>
  <meta name="description" content="Private entrance to the Dave + Grant vibe playground." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <script defer src="assets/js/main.js"></script>
</head>
<body data-page="gate" class="page-gate">
  <div class="ambient-layer" aria-hidden="true"></div>
  <main class="center-shell">
    <section class="gate-card glass" data-reveal>
      <p class="kicker">Vibe Coding Portal</p>
      <h1>What's my favorite word?</h1>
      <p class="muted">Enter the word to unlock the shared playground.</p>
      <form id="gate-form" class="stack">
        <label for="gate-input">Answer</label>
        <input id="gate-input" name="answer" type="password" autocomplete="off" required />
        <button class="btn btn-primary" type="submit">Unlock The Lab</button>
      </form>
      <p id="gate-error" class="error-text" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
